{% extends 'base.html' %}
{% block title %}Acesso Negado{% endblock %}
{% block content %}
<div class="error-page">
    <div class="error-page-code">403</div>
    <h1>Acesso negado</h1>
    <p>Você não tem permissão para acessar esta página ou executar esta ação.</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-app-primary">
        <i class="bi bi-house"></i> Voltar ao início
    </a>
</div>
{% endblock %}
