{% extends 'base.html' %}
{% block title %}Página Não Encontrada{% endblock %}
{% block content %}
<div class="error-page">
    <div class="error-page-code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi movido.</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-app-primary">
        <i class="bi bi-house"></i> Voltar ao início
    </a>
</div>
{% endblock %}
