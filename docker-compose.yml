version: '3.8'

services:
  web:
    build: .
    container_name: gestao_financeira_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///financeiro.db}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-True}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - COMPANY_NAME=${COMPANY_NAME:-Minha Empresa Ltda}
    volumes:
      - ./logs:/app/logs
      - ./instance:/app/instance
    networks:
      - financeiro_net
    depends_on: []

  nginx:
    image: nginx:alpine
    container_name: gestao_financeira_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docs/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./app/static:/app/static
    depends_on:
      - web
    networks:
      - financeiro_net

networks:
  financeiro_net:
    driver: bridge

volumes:
  logs:
  instance:
